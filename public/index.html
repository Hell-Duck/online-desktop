<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Онлайн-доска</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #eef2f7; color: #172033; }
    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(37,99,235,.28); outline-offset: 2px; }

    /* ---- Экран входа ---- */
    #lobby {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #f0f2f5; z-index: 100;
    }
    .card {
      background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
      width: 340px; text-align: center;
    }
    .card h1 { font-size: 20px; margin: 0 0 20px; }
    .card input {
      width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #d0d4db;
      border-radius: 8px; margin-bottom: 12px;
    }
    .card button {
      width: 100%; padding: 10px; font-size: 15px; border: none; border-radius: 8px;
      background: #2563eb; color: #fff; cursor: pointer; margin-bottom: 8px;
    }
    .card button.secondary { background: #e5e7eb; color: #111; }
    .card .hint { font-size: 13px; color: #6b7280; margin-top: 4px; }

    /* ---- Доска ---- */
    #toolbar {
      display: none; position: fixed; top: 0; left: 0; right: 0; height: 52px;
      background: rgba(255,255,255,.97); border-bottom: 1px solid #dfe5ee; align-items: center;
      gap: 6px; padding: 0 12px; z-index: 10; box-shadow: 0 2px 12px rgba(30,41,59,.07);
      overflow-x: auto; white-space: nowrap;
    }
    #toolbar button {
      border: 1px solid #d0d4db; background: #fff; border-radius: 8px; padding: 6px 10px;
      cursor: pointer; font-size: 13px; transition: background .15s, border-color .15s, transform .15s;
    }
    #toolbar button:hover { background: #f1f5f9; border-color: #aeb9ca; }
    #toolbar button:active { transform: translateY(1px); }
    #toolbar button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    #toolbar .sep { width: 1px; height: 28px; background: #e5e7eb; margin: 0 4px; }
    #toolbar select { border: 1px solid #d0d4db; background: #fff; border-radius: 8px; padding: 6px 8px; font-size: 14px; cursor: pointer; }
    #thicknessWrap { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6b7280; }
    #thicknessWrap input[type=range] { width: 90px; cursor: pointer; }
    #thicknessWrap span { width: 20px; text-align: right; color: #111; }
    #thicknessWrap.disabled { opacity: .4; pointer-events: none; }

    /* Контекстное меню текста */
    #textToolbar {
      display: none; position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.1);
      padding: 6px 10px; gap: 8px; align-items: center; z-index: 20; font-size: 14px;
    }
    #textToolbar label { display: flex; align-items: center; gap: 4px; color: #6b7280; }
    #textToolbar input[type=number] { width: 56px; padding: 4px 6px; border: 1px solid #d0d4db; border-radius: 6px; font-size: 14px; }
    #textToolbar button.fmt { width: 32px; height: 32px; border: 1px solid #d0d4db; background: #fff; border-radius: 6px; cursor: pointer; font-size: 15px; }
    #textToolbar button.fmt.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    #toolbar .room-info { margin-left: auto; font-size: 13px; color: #6b7280; }
    #toolbar .room-info b { color: #111; }
    #exitBtn { margin-left: 10px; border-color: #ef4444; color: #ef4444; }
    #exitBtn:hover { background: #ef4444; color: #fff; }
    canvas { display: block; }

    /* Левая панель инструментов */
    #sidebar {
      display: none; position: fixed; top: 52px; left: 0; bottom: 0; width: 52px;
      background: #fff; border-right: 1px solid #e5e7eb; flex-direction: column; align-items: center;
      gap: 6px; padding: 8px 0; z-index: 10;
    }
    #sidebar button {
      width: 40px; height: 40px; border: 1px solid #d0d4db; background: #fff; border-radius: 8px;
      cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    }
    #sidebar button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    #sidebar button:hover { background: #eff6ff; border-color: #93b4f4; }

    /* Постоянная палитра */
    #colorPalette {
      display: none; position: fixed; right: 18px; bottom: 18px; z-index: 25;
      align-items: center; gap: 7px; padding: 9px 11px; border: 1px solid #d9e1ec;
      border-radius: 16px; background: rgba(255,255,255,.96); box-shadow: 0 8px 28px rgba(30,41,59,.16);
    }
    .color-swatch {
      width: 26px; height: 26px; padding: 0; border-radius: 50%; cursor: pointer;
      border: 2px solid #fff; box-shadow: 0 0 0 1px #cbd5e1; transition: transform .15s, box-shadow .15s;
    }
    .color-swatch:hover { transform: scale(1.12); }
    .color-swatch.active { box-shadow: 0 0 0 3px #2563eb; }
    #customColor {
      width: 32px; height: 32px; padding: 2px; border: 1px solid #cbd5e1;
      border-radius: 9px; background: #fff; cursor: pointer;
    }
    #zoomLabel { min-width: 44px; text-align: center; font-size: 12px; font-weight: 700; color: #475569; }

    /* Курсоры других участников */
    #cursorLayer { display: none; position: fixed; top: 52px; left: 52px; right: 0; bottom: 0; pointer-events: none; overflow: hidden; z-index: 30; }
    .remote-cursor { position: absolute; transition: left .05s linear, top .05s linear; }
    .remote-cursor .cur-edge { display: none; }
  </style>
</head>
<body>
  <div id="lobby">
    <div class="card">
      <h1>Онлайн-доска</h1>
      <input id="roomInput" placeholder="Код комнаты" />
      <button id="joinBtn">Войти в комнату</button>
      <button id="createBtn" class="secondary">Создать новую</button>
      <div class="hint">Поделитесь кодом или ссылкой со вторым участником</div>
    </div>
  </div>

  <!-- Левая панель инструментов рисования -->
  <div id="sidebar">
    <button data-tool="select" class="active" title="Выделение объектов">⬚</button>
    <button data-tool="pan" title="Двигать полотно (или зажми пробел)">✋</button>
    <button data-tool="pen" title="Карандаш">✏️</button>
    <button data-tool="rect" title="Прямоугольник">▭</button>
    <button data-tool="circle" title="Круг">◯</button>
    <button data-tool="line" title="Линия">╱</button>
    <button data-tool="text" title="Текст">T</button>
    <button data-tool="eraser" title="Стёрка — стирает всё">🧽</button>
    <button data-tool="eraser-soft" title="Стёрка — не трогает вставленные картинки">🧽🛡</button>
  </div>

  <div id="toolbar">
    <select id="sheet" title="Вид листа">
      <option value="white">Белый</option>
      <option value="ruled">Линейка</option>
      <option value="grid">Клетка</option>
    </select>
    <div class="sep"></div>
    <label id="thicknessWrap" title="Толщина (карандаш / стёрки / фигуры)">
      <input type="range" id="thickness" min="1" max="40" value="3" />
      <span id="thicknessVal">3</span>
    </label>
    <button id="imageBtn" title="Вставить картинку">🖼 Картинка</button>
    <button id="deleteBtn" title="Удалить выбранное">🗑</button>
    <button id="undoBtn" title="Отменить последнее общее действие (Ctrl+Z)">↶ Отменить</button>
    <button id="redoBtn" title="Повторить отменённое действие (Ctrl+Y)">↷ Повторить</button>
    <button id="resetViewBtn" title="Сбросить масштаб и позицию">⤢ Вид</button>
    <span id="zoomLabel" aria-live="polite">100%</span>
    <button id="cursorBtn" title="Показывать мой курсор другому участнику">👁 Курсор</button>
    <button id="findBtn" title="Перенестись к курсору другого участника">🎯 К курсору</button>
    <button id="saveBtn" title="Сохранить доску в PNG (всё нарисованное)">💾 Сохранить</button>
    <button id="clearBtn" title="Очистить доску">Очистить</button>
    <input type="file" id="imageInput" accept="image/*" style="display:none" />
    <div class="room-info">Комната: <b id="roomLabel"></b> · участников: <span id="peerCount">1</span></div>
    <button id="exitBtn" title="Выйти из комнаты">Выйти</button>
  </div>

  <!-- Контекстное меню текста: показывается только при работе с текстом -->
  <div id="textToolbar">
    <label>Размер <input type="number" id="fontSize" min="8" max="200" value="22" /></label>
    <button id="boldBtn" class="fmt" title="Жирный" style="font-weight:700">Ж</button>
    <button id="italicBtn" class="fmt" title="Курсив" style="font-style:italic">К</button>
    <button id="underlineBtn" class="fmt" title="Подчёркнутый" style="text-decoration:underline">Ч</button>
  </div>

  <div id="colorPalette" aria-label="Палитра цветов">
    <button class="color-swatch" data-color="#111827" aria-label="Графитовый" style="background:#111827"></button>
    <button class="color-swatch" data-color="#ffffff" aria-label="Белый" style="background:#ffffff"></button>
    <button class="color-swatch" data-color="#ef4444" aria-label="Красный" style="background:#ef4444"></button>
    <button class="color-swatch" data-color="#f97316" aria-label="Оранжевый" style="background:#f97316"></button>
    <button class="color-swatch" data-color="#eab308" aria-label="Жёлтый" style="background:#eab308"></button>
    <button class="color-swatch" data-color="#22c55e" aria-label="Зелёный" style="background:#22c55e"></button>
    <button class="color-swatch" data-color="#06b6d4" aria-label="Бирюзовый" style="background:#06b6d4"></button>
    <button class="color-swatch" data-color="#2563eb" aria-label="Синий" style="background:#2563eb"></button>
    <button class="color-swatch" data-color="#7c3aed" aria-label="Фиолетовый" style="background:#7c3aed"></button>
    <button class="color-swatch" data-color="#ec4899" aria-label="Розовый" style="background:#ec4899"></button>
    <input type="color" id="customColor" value="#111827" aria-label="Произвольный цвет" title="Выбрать любой цвет" />
  </div>

  <canvas id="board"></canvas>
  <div id="cursorLayer"></div><!-- курсоры других участников -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <script src="/fabric-eraser.js"></script><!-- модуль пиксельного ластика (нет в основной сборке) -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/board-utils.js"></script>
  <script src="/client.js"></script>
</body>
</html>
